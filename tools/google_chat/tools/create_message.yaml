identity:
  name: create_message
  author: langgenius
  label:
    en_US: Create Message
    zh_Hans: 创建消息
    ja_JP: メッセージを作成
  icon: icon.svg

description:
  human:
    en_US: Send a new message to a Google Chat space
    zh_Hans: 向 Google Chat 空间发送新消息
    ja_JP: Google Chat スペースに新しいメッセージを送信
  llm: Create and send a text message in a Google Chat space with optional threading and reply capabilities

parameters:
  - name: space_name
    type: string
    required: true
    form: llm
    label:
      en_US: Space Name
      zh_Hans: 空间名称
      ja_JP: スペース名
    human_description:
      en_US: The resource name of the space (e.g., spaces/AAAA1234567 or just AAAA1234567)
      zh_Hans: 空间的资源名称（例如：spaces/AAAA1234567 或仅 AAAA1234567）
      ja_JP: スペースのリソース名（例：spaces/AAAA1234567 または AAAA1234567のみ）
    llm_description: The unique identifier or resource name of the Google Chat space to send the message to

  - name: text
    type: string
    required: true
    form: llm
    label:
      en_US: Message Text
      zh_Hans: 消息文本
      ja_JP: メッセージテキスト
    human_description:
      en_US: The text content of the message to send
      zh_Hans: 要发送的消息文本内容
      ja_JP: 送信するメッセージのテキスト内容
    llm_description: The text content of the message to be sent

  - name: thread_name
    type: string
    required: false
    form: llm
    label:
      en_US: Thread Name
      zh_Hans: 线程名称
      ja_JP: スレッド名
    human_description:
      en_US: Optional thread to post the message in (for threaded conversations)
      zh_Hans: 可选的线程名称（用于线程对话）
      ja_JP: メッセージを投稿するオプションのスレッド（スレッド会話用）
    llm_description: Optional thread identifier to post the message in a specific conversation thread

  - name: reply_to
    type: string
    required: false
    form: llm
    label:
      en_US: Reply To Message
      zh_Hans: 回复消息
      ja_JP: メッセージに返信
    human_description:
      en_US: Optional message ID to reply to
      zh_Hans: 可选的要回复的消息 ID
      ja_JP: 返信するオプションのメッセージID
    llm_description: Optional message ID to create this message as a reply to another message

  - name: request_id
    type: string
    required: false
    form: llm
    label:
      en_US: Request ID
      zh_Hans: 请求 ID
      ja_JP: リクエストID
    human_description:
      en_US: Optional unique request ID for idempotency
      zh_Hans: 用于幂等性的可选唯一请求 ID
      ja_JP: 冪等性のためのオプションの一意のリクエストID
    llm_description: Optional unique request identifier to ensure idempotency of the message creation

output_schema:
  type: object
  properties:
    name:
      type: string
      description: The resource name of the created message
    text:
      type: string
      description: The text content of the message
    createTime:
      type: string
      description: When the message was created
    sender:
      type: object
      description: Information about the message sender
    thread:
      type: object
      description: Thread information if the message is in a thread

extra:
  python:
    source: tools/create_message.py