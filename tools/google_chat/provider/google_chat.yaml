extra:
  python:
    source: provider/google_chat.py
identity:
  author: langgenius
  description:
    en_US: Connect to Google Chat API for messaging and collaboration
    ja_JP: Google Chat API に接続してメッセージングとコラボレーション
    zh_Hans: 连接到 Google Chat API 进行消息传递和协作
  icon: icon.svg
  label:
    en_US: Google Chat
    ja_JP: Google Chat
    zh_Hans: Google Chat
  name: google_chat
  tags:
  - utilities
oauth_schema:
  client_schema:
  - help:
      en_US: Get your Client ID from Google Cloud Console
      ja_JP: Google Cloud Console からクライアント ID を取得します
      zh_Hans: 从 Google Cloud Console 获取您的客户端 ID
    label:
      en_US: Client ID
      ja_JP: クライアント ID
      zh_Hans: 客户端 ID
    name: client_id
    placeholder:
      en_US: Enter your OAuth 2.0 Client ID
      ja_JP: OAuth 2.0 クライアント ID を入力してください
      zh_Hans: 输入您的 OAuth 2.0 客户端 ID
    required: true
    type: secret-input
    url: https://console.cloud.google.com/apis/credentials
  - help:
      en_US: Get your Client Secret from Google Cloud Console
      ja_JP: Google Cloud Console からクライアントシークレットを取得します
      zh_Hans: 从 Google Cloud Console 获取您的客户端密钥
    label:
      en_US: Client Secret
      ja_JP: クライアントシークレット
      zh_Hans: 客户端密钥
    name: client_secret
    placeholder:
      en_US: Enter your OAuth 2.0 Client Secret
      ja_JP: OAuth 2.0 クライアントシークレットを入力してください
      zh_Hans: 输入您的 OAuth 2.0 客户端密钥
    required: true
    type: secret-input
    url: https://console.cloud.google.com/apis/credentials
  credentials_schema:
  - label:
      en_US: Access Token
      ja_JP: アクセストークン
      zh_Hans: 访问令牌
    name: access_token
    type: secret-input
  - label:
      en_US: Refresh Token
      ja_JP: リフレッシュトークン
      zh_Hans: 刷新令牌
    name: refresh_token
    type: secret-input
tools:
- tools/get_space.yaml
- tools/get_member.yaml
- tools/list_members.yaml
- tools/create_message.yaml
- tools/get_message.yaml
- tools/list_messages.yaml
- tools/list_spaces.yaml
