identity:
  name: get_message
  author: langgenius
  label:
    en_US: Get Message
    zh_Hans: 获取消息
    ja_JP: メッセージを取得
  icon: icon.svg

description:
  human:
    en_US: Get a specific message from a Google Chat space
    zh_Hans: 从 Google Chat 空间获取特定消息
    ja_JP: Google Chat スペースから特定のメッセージを取得
  llm: Retrieve detailed information about a specific message in a Google Chat space including content, sender, reactions, and metadata

parameters:
  - name: message_name
    type: string
    required: true
    form: llm
    label:
      en_US: Message Name
      zh_Hans: 消息名称
      ja_JP: メッセージ名
    human_description:
      en_US: The resource name of the message (e.g., spaces/SPACE_ID/messages/MESSAGE_ID or just MESSAGE_ID with space_name)
      zh_Hans: 消息的资源名称（例如：spaces/SPACE_ID/messages/MESSAGE_ID 或仅 MESSAGE_ID 配合 space_name）
      ja_JP: メッセージのリソース名（例：spaces/SPACE_ID/messages/MESSAGE_ID またはspace_nameと共にMESSAGE_IDのみ）
    llm_description: The full resource name of the message or just the message ID if space_name is provided

  - name: space_name
    type: string
    required: false
    form: llm
    label:
      en_US: Space Name (Optional)
      zh_Hans: 空间名称（可选）
      ja_JP: スペース名（オプション）
    human_description:
      en_US: Optional space name if only message ID is provided
      zh_Hans: 如果仅提供消息 ID，则需要空间名称
      ja_JP: メッセージIDのみ提供される場合のオプションのスペース名
    llm_description: Optional space identifier, required if message_name is only the message ID

output_schema:
  type: object
  properties:
    name:
      type: string
      description: The resource name of the message
    text:
      type: string
      description: The text content of the message
    createTime:
      type: string
      description: When the message was created
    sender:
      type: object
      description: Information about the message sender
      properties:
        name:
          type: string
        displayName:
          type: string
        type:
          type: string
    thread:
      type: object
      description: Thread information if the message is in a thread
    emojiReactionSummaries:
      type: array
      description: Emoji reactions on the message
    attachments:
      type: array
      description: File attachments on the message

extra:
  python:
    source: tools/get_message.py